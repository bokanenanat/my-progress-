<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>My progress🌱</title>
    <style>
      * {
        margin: 0;
            padding: 0;
  -webkit-tap-highlight-color: transparent;
          }
          :root {
            --green: #00ff88;
            --blue: #0099ff;
            --golden: #fa0;
            --black: #000;
          }
          body {
            background:
      radial-gradient(circle at 100% 100%, #000 10%, #8884 20%, transparent 0.5%),
      #000;
            display: grid;
            justify-items: center;
            min-height: 100dvh;
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            overflow-x: hidden;
            margin: 0;
          }
          header {
            width: 80vw;
            aspect-ratio: 4/1;
            border: 1px solid #999;
            border-right: none;
            border-left: none;
            border-radius: 999px;
            margin-top: 50%;
            display: flex;
            justify-content: center;
            align-items: center;

          }
          header h1 {
            font-size: 6vw;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: var(--black);
            text-shadow: 0 0 10px var(--golden);
            -webkit-text-stroke: 1px var(--golden);
          }
      @keyframes scale {
        0%  {font-size: 1vw;}
        45% {font-size: 8vw;}
        50% {font-size: 6vw;}
        55% {font-size: 8vw;}
        100%{font-size: 1vw;}
      }
          header i {
            color: #0f0;
            text-shadow: 0 0 10px #0f0;;
            font-size: 8vw;
            animation: scale 3s infinite;
          }
          .section-projects {
            width: 80%;
            height: 250vh;
            margin-top: 50%;
            border: 1px solid #fff1;
            border-radius: 10vw;
            background: #ffffff04;
            box-shadow: 0 0 4px #fff4;
            overflow-x: hidden;
            overflow-y: hidden;
            display: grid;
            gap: 1px;
            grid-template-rows: repeat(10,1fr);
            grid-template-columns: 1fr 1fr;
          }
      @keyframes shadow {
        0% {box-shadow: 0 0 4vw var(--black)}
        30% {box-shadow: none}
        60% {box-shadow: 0 0 4vw var(--black)}
      }
          .section-projects a {
            height: 100%;
            text-decoration: none;
            width: 100%;
            border-radius: 4vw;
            background: none;
            border-bottom: 1px solid var(--black);
            border-right: 1px solid var(--black);
            border-left: 1px solid #8882;
            box-shadow: 0 0 2vw var(--black);
            animation: shadow 3s infinite;
            display: grid;
            gap: 4px;
            grid-template-rows: 3fr 1fr 1fr;
            justify-items: center;
          }
      .section-projects a img {
        width: 60%;
        
        aspect-ratio: 1/1;
        border: 1px solid var(--green);
        box-shadow: 0 0 2vw var(--green);
        border-radius: 2vw;
      }
      .section-projects a h1 {
        width: 90%;
        height: 90%;
        border: 1px solid #999;
        font-size: 3vw;
        color: var(--green);
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      
    </style>
  </head>
